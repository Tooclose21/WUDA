apiVersion: v1
kind: Service
metadata:
  name: {{ include "wuda.fullname" . }}-backend
  labels:
    app: {{ include "wuda.fullname" . }}-backend
spec:
  type: {{ .Values.service.backend.type }}
  ports:
    - port: {{ .Values.service.backend.port }}
      targetPort: {{ .Values.service.backend.port }}
      protocol: TCP
      name: http
  selector:
    app: {{ include "wuda.fullname" . }}-backend

