name: Automated frontend check and build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  frontend-cicd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r front-end/requirements.txt
          pip install pytest flake8

      - name: Run vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './front-end'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
          exit-code: 1

      - name: Run linting
        working-directory: ./front-end
        run: flake8 .

      - name: Run tests
        working-directory: ./front-end
        run: pytest tests

  build-and-push:
    runs-on: ubuntu-latest
    needs: frontend-cicd
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}

      - name: Convert owner and repo name to lowercase
        id: names
        run: |
          echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV
          echo "repo_lc=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./front-end
          push: true
          tags: |
            ghcr.io/${{ env.owner_lc }}/wuda-frontend:latest
            ghcr.io/${{ env.owner_lc }}/wuda-frontend:${{ github.sha }}
